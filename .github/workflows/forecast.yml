# Боевой бот: один job крутит цикл опроса ~5 ч 25 мин (каждые 10 мин), в конце перезапускает сам себя.
# Почему так: окно приёма прогноза в турнирах — 3 ч, а cron */20 за 9+ часов сработал 2 раза (00:08 и 05:24 UTC,
# 02–03.10.2026) — GitHub не гарантирует расписание. Cron раз в час оставлен страховкой, если цепочка оборвётся.
# Репо публичный → минуты Actions не тратят квоту Papagera (решение Никиты 02.10.2026).
# Лимиты GitHub (docs.github.com/en/actions/reference/limits): job ≤ 6 ч, Free — до 20 одновременных job; у нас 1.
#
# Предохранители:
# - job выполняется ТОЛЬКО при переменной репозитория FORECAST_SUBMIT=1 (Settings → Variables);
#   без неё job пропускается целиком и сам себя не перезапускает. Выключить бота = удалить переменную.
#   Ручная отмена прогона (Cancel) тоже обрывает цепочку: перезапуск только при success/failure.
# - раннер сам проверяет второй ключ: --mode submit И env FORECAST_SUBMIT=1 (forecast_bot/run.py).
# - «не дважды»: my_forecasts бот-аккаунта по API Metaculus (первично) + журнал из кэша (вторично).
# - деньги: $1 на каждый опрос (--run-budget) + $6 в сутки по леджеру ai_guard (APP_LIMITS["forecast"]),
#   суточный потолок проверяется перед каждым опросом и на каждом вызове модели;
#   кэш потерян → остаётся лимит опроса, страховка — лимит $50 на самом ключе OpenRouter.
# - турниры: переменная репо FORECAST_TOURNAMENTS (по умолчанию «fall,minibench»); «pulse» — Market Pulse,
#   сезон (market-pulse-YYqN) подхватывается сам, прогноз обновляется по расписанию (spot-очки на закрытии).
# - concurrency: два цикла одновременно не идут. Новый запуск (cron/перезапуск), пока цикл идёт, встаёт в очередь
#   и ждёт; GitHub держит в очереди один ожидающий и заменяет его более свежим — дублей не копится.
name: forecast

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # перезапуск себя через `gh workflow run` (workflow_dispatch от GITHUB_TOKEN разрешён)

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    if: vars.FORECAST_SUBMIT == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 360   # максимум GitHub (6 ч): цикл 325 + запас 5 + подготовка ~5 + повторы перезапуска до 12.5
    env:
      METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
      FORECAST_SUBMIT: ${{ vars.FORECAST_SUBMIT }}
      # Состояние между запусками (журнал, леджер, лок, статистика цикла) — в state/, сохраняется actions/cache.
      FORECAST_DATA_DIR: ${{ github.workspace }}/state
      FORECAST_STATE_DIR: ${{ github.workspace }}/state
      FORECAST_REPORTS_DIR: ${{ github.workspace }}/state/reports
      AI_LEDGER_PATH: ${{ github.workspace }}/state/ai_ledger.db
      # 5 прогнозов на вопрос (Никита 07.10.2026): до 27 строк леджера на прогноз вопроса (агент 7 + поиск 2×2 +
      # 5 прогнозов + 5 разборов; тест test_calib), а Market Pulse обновляется до 5 раз за сутки (суточное + 4 в
      # последние 12 ч, run.needs_update). Штатные 20/сутки на вопрос (ai_guard per_user_day_calls) отсекли бы прогноз
      # посреди работы и остановили опрос. Деньги держат --run-budget $1 и APP_LIMITS["forecast"] $6/сутки.
      AI_USER_DAY_CALLS: "150"
      FORECAST_ENV_FILE: ${{ github.workspace }}/.env.absent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Зависимости (пины + вендоренная forecasting-tools)
        run: |
          pip install -r requirements.lock.txt
          pip install --no-deps -e vendor/forecasting-tools-0.3.2

      - name: Восстановить состояние (журнал + леджер)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: forecast-state-${{ github.run_id }}
          restore-keys: forecast-state-

      # Вариант B (блок 2.1): исследует агент с проверкой чисел по источникам, решает Opus 5.5 high.
      # Исследователь — Gemini 3.8 Flash с 05.10.2026 (замер H/S/G; Haiku 4.5 retirement не раньше 15.10.2026).
      - name: Цикл прогнозов и отправки
        run: >
          python -m forecast_bot.run --mode submit
          --tournaments "${{ vars.FORECAST_TOURNAMENTS || 'fall,minibench' }}" --quant-hints
          --research agent --search web --agent-model openrouter/google/gemini-3.8-flash --agent-max-news 2
          --model openrouter/anthropic/claude-opus-5.5 --reasoning high --predictions 5 --run-budget 1.0
          --loop-minutes 325 --poll-minutes 10

      - name: Итог цикла
        if: always()
        run: python -m forecast_bot.summary --since-minutes 360 >> "$GITHUB_STEP_SUMMARY"

      - name: Сохранить состояние
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: forecast-state-${{ github.run_id }}-${{ github.run_attempt }}

      # Повторы на 5xx/сети (07.10.2026: HTTP 500 при инциденте GitHub оборвал цепочку на час) — 30/60/120/240/300 с.
      - name: Перезапустить цикл
        if: success() || failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m forecast_bot.restart --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
